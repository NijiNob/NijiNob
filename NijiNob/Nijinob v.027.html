<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NijiNob v0.27 — 女を奪い、天下を取れ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand"><h1>NijiNob v0.27 <span style="color:var(--gold)">/</span> 女を奪い、天下を取れ</h1><p>16国を制し、女を捕らえ、屈服させ、陳列せよ。</p></div>
 <div class="turnbox"><div><div class="eyebrow">TURN</div><div class="turnnum" id="turn">1</div></div><button class="primary" id="nextTop">次のターン →</button></div>
</header>
<section class="hud" id="hud"></section>
<div class="layout">
 <aside class="sidetiles" id="sidetiles"></aside>
 <section class="panel">
  <div class="panelhead"><div><h2>勢力地図</h2><div class="eyebrow">4 × 4 国土図 · 上下左右の隣接国へ侵攻可能</div></div><span class="pill" id="landCount">領土 1 / 16</span></div>
  <div class="mapgrid" id="map"></div>
  <div class="legend"><span><i class="dot" style="background:#8a6fc0"></i>自勢力</span><span><i class="dot" style="background:var(--gold)"></i>侵攻可能</span><span><i class="dot" style="background:#e07a6a"></i>交戦中</span><span><i class="dot" style="background:#3a3a3a"></i>敵勢力</span></div>
  <div class="separator"></div>
  <div class="panelhead"><h2>行動コマンド</h2><span class="eyebrow">行動後にターンを進めよう</span></div>
  <div class="commands">
   <button id="attackBtn" class="primary"><strong>⚔ 攻める</strong><small>隣接する敵国へ侵攻</small></button>
   <button id="recruitBtn"><strong>♟ 募兵</strong><small>金 1,000 + 兵糧 300 → 兵力 500</small></button>
   <button id="buildBtn"><strong>⌂ 建設</strong><small>一般施設を建てる</small></button>
   <button id="specialBtn"><strong>◆ 勢力建造物</strong><small>監獄・監視塔を強化</small></button>
   <button id="nextBtn"><strong>◷ 次のターン</strong><small>収入・兵糧消費・屈服経過</small></button>
   <button id="prestigeBtn"><strong>⚑ 威信</strong><small>勢力の現在評価を見る</small></button>
  </div>
 </section>
 <aside class="sidecol">
  <section class="panel">
   <div class="tabs"><button class="active" data-rtab="country">国情報</button><button data-rtab="captives" id="capTabBtn">捕虜</button><button data-rtab="lands">自勢力</button><button data-rtab="specials">勢力建造物</button></div>
   <div id="rightbody"></div>
  </section>
  <section class="panel">
   <div class="tabs"><button class="active" data-ltab="log">ログ</button></div>
   <div id="leftbody"></div>
  </section>
 </aside>
</div>
<div class="bottom">
 <div class="left"><button id="saveBtn">保存</button><button id="loadBtn">ロード</button><button id="manualBtn">説明書</button><button id="resetBtn" class="danger">新規開始</button></div>
 <div class="right"><span class="notice">自動保存あり · ryakudatsu_v0.27 · 外部データ読み込み</span></div>
</div>
</div>
<div id="modalroot"></div><div id="toast" class="toast hidden"></div>

<script src="data/text.js"></script>
<script src="main.js"></script>
</body>
</html>
